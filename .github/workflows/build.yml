name: build

on:
  push:
    tags: ['*.*.*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Run tests
      run: cargo test --all-features --verbose

    - name: Extract release notes
      run: |
        awk -v ver="${{ github.ref_name }}" '
          $0 ~ "^## \\[" ver "\\]" { found = 1; next }
          found && /^## \[/ { exit }
          found { print }
        ' CHANGELOG.md > "${{ runner.temp }}/RELEASE_NOTES.md"
        if [ ! -s "${{ runner.temp }}/RELEASE_NOTES.md" ]; then
          echo "::error::No CHANGELOG.md section found for ${{ github.ref_name }}"
          exit 1
        fi
        cat "${{ runner.temp }}/RELEASE_NOTES.md"

    - name: Upload release
      uses: softprops/action-gh-release@v2
      with:
        body_path: ${{ runner.temp }}/RELEASE_NOTES.md
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Publish cargo package
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_ACCESS_TOKEN }}
      run: cargo publish
